# Default values for keycloak.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: quay.io/keycloak/keycloak
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "26.7.2"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# Use mariadbOperator for creating database, user, grant etc in defined namespace
# This requires a preinstalled mariadb-operator
# https://github.com/mariadb-operator/mariadb-operator
mariadbOperator:
  # enable creating crs for this app
  enabled: false
  # Database created by this chart
  database: keycloak
  # Username created by this chart
  username: keycloak
  # Password created by this chart
  password: keycloakpass
  # storageClass for mariadb (not relevant if mariadbOperator.useExisting is used)
  storageClass: longhorn
  # use a existing mariadb managed by operator and will not create a new mariadb instance for example if you have a one big mariadb or galera
  useExisting:
    # enable use of existing mariadb instance
    enabled: false
    # namespace with existing mariadb
    namespace: {}
    # mariadb ref (name in mariadb cr) from existing mariadb
    mariaDbRef: {}

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  #runAsNonRoot: true
  #runAsUser: 1000
  #runAsGroup: 1000
  #fsGroup: 1000
  #seccompProfile:
  #  type: RuntimeDefault

securityContext: {}
  #allowPrivilegeEscalation: false
  #capabilities:
  #  drop:
  #    - ALL

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
#
# The default paths are an allow-list that intentionally EXCLUDES the admin
# surface (`/admin`, i.e. the admin console and admin REST API incl. the master
# realm). Anything not listed here is not routed and returns 404 on the public
# host(s). Expose the admin console via the dedicated `adminIngress` below.
#
# No hostname is pinned in Keycloak, so the same instance can be served on
# multiple public domains in parallel.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      # Minimal set of public endpoints recommended by Keycloak for a reverse
      # proxy (https://www.keycloak.org/server/reverseproxy). This serves the
      # login UI + OIDC while leaving "/" (welcome page) and "/admin" (admin
      # console + REST, incl. the master realm) unrouted -> 404 on public hosts.
      # Add "/admin" here only if you deliberately want it public.
      paths:
        - path: /realms
          pathType: Prefix
        - path: /resources
          pathType: Prefix
        - path: /.well-known
          pathType: Prefix
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# Dedicated ingress that DOES expose the admin surface (`/admin`, admin console
# and admin REST incl. the master realm). Point it at an internal-only host so
# the admin console is separated from the public `ingress` above, and lock it
# down further (internal-only ingress class, IP allow-lists, separate TLS, ...).
adminIngress:
  enabled: false
  className: ""
  annotations: {}
    # Example: restrict access to internal networks (nginx)
    # nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8"
  hosts:
    - host: keycloak-admin.example.com
      # "/" serves the whole instance (incl. /admin) on this internal host.
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: keycloak-admin-tls
    #   hosts:
    #     - keycloak-admin.example.com

# Public HTTPRoute. Like `ingress` above, the default matches are an allow-list
# that EXCLUDES the admin surface (`/admin`). Gateway API routes by longest
# matching prefix, so listing only the public prefixes keeps `/admin` unrouted
# on the public host(s). Expose the admin console via `adminHttpRoute` below.
httpRoute:
  enabled: false
  annotations: {}
  hostnames:
    - keycloak.example.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway-external
      namespace: envoy-gateway-system
  matches:
    - path:
        type: PathPrefix
        value: /realms
    - path:
        type: PathPrefix
        value: /resources
    - path:
        type: PathPrefix
        value: /.well-known

# Dedicated HTTPRoute that DOES expose the admin surface (`/admin`, admin
# console and admin REST incl. the master realm). Point `parentRefs` at an
# internal Gateway so the admin surface stays separated from the public route.
adminHttpRoute:
  enabled: false
  annotations: {}
  hostnames:
    - keycloak-admin.example.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway-internal
      namespace: envoy-gateway-system
  matches:
    - path:
        type: PathPrefix
        value: /

# Keycloak admin credentials
admin:
  username: admin
  password: admin

# Database configuration, will automaticly set if db operator is used
database:
  # Database type (mariadb, postgres, etc.)
  type: mariadb
  # Database name
  name: keycloak
  # Database username
  username: keycloak
  # Database password
  password: keycloakpas
  # Will be automacticaly set when db operator is used
  host: ""
  port: 3306
  dbUrl: ""

# Custom themes configuration
themes:
  # Enable custom themes
  enabled: false

  # Persistence for themes
  persistence:
    storageClass: "" # leave empty for default
    accessMode: ReadWriteMany # RWX needed for multiple replicas
    size: 1Gi

  # Alternative: Use existing PVC
  existingClaim: ""

  # Sidecar container for easy theme management
  sidecar:
    enabled: false
    image: alpine:latest
    pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 50m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 32Mi
    securityContext: {}
      # runAsNonRoot: true
      # runAsUser: 1000
      # allowPrivilegeEscalation: false

# Keycloak specific configuration
keycloak:
  # JVM options
  javaOptsHeap: >-
    -XX:InitialRAMPercentage=10.0
    -XX:MaxRAMPercentage=70.0

  javaOptsAppend: >-
    -XX:+UseG1GC
    -XX:+DisableExplicitGC
    -XX:+ExitOnOutOfMemoryError
    -XX:G1PeriodicGCInterval=120000
    -XX:G1PeriodicGCSystemLoadThreshold=0
    -XX:MinHeapFreeRatio=10
    -XX:MaxHeapFreeRatio=20

  # Proxy configuration (for ingress/load balancer)
  proxy:
    headers: xforwarded

  # Cache configuration
  cache:
    type: ispn # ispn (Infinispan) for clustered setup, local for single node

  # Hostname configuration
  hostname:
    # Keep strict disabled so Keycloak derives the hostname from the incoming
    # request. This lets you serve the same instance on multiple domains in
    # parallel without pinning a fixed KC_HOSTNAME.
    strict: false

  # Relative http path
  httpPath: "/"

  # Container args
  args:
    - start

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 3
    memory: 768Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health/live
    port: 9000
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 9000
  periodSeconds: 10
  failureThreshold: 3

# Additional container environment variables, appended to the ones the chart
# already sets. Useful for JVM/runtime tuning that is not a JVM flag, e.g.
# limiting glibc malloc arenas to curb container RSS fragmentation:
#   - name: MALLOC_ARENA_MAX
#     value: "2"
extraEnv: []

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
