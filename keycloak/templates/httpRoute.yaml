{{- if .Values.httpRoute.enabled -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- with .Values.httpRoute.rootRedirect }}
    {{- if .enabled }}
    # Redirects the bare host root (`/`) to a friendlier landing page, e.g.
    # the realm account console. Matched with `Exact` so only the root path
    # triggers it — all other paths keep following the regular matches below.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ .path | quote }}
            {{- with .statusCode }}
            statusCode: {{ . }}
            {{- end }}
    {{- end }}
    {{- end }}
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ include "keycloak.fullname" $ }}
          port: {{ .Values.service.port }}
          weight: 1
      {{- with .Values.httpRoute.matches }}
      matches:
      {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
